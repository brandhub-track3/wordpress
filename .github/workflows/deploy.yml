name: WordPress Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Load EC2 SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create production environment file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          WORDPRESS_DB_NAME: ${{ secrets.WORDPRESS_DB_NAME }}
          WORDPRESS_DB_USER: ${{ secrets.WORDPRESS_DB_USER }}
          WORDPRESS_DB_PASSWORD: ${{ secrets.WORDPRESS_DB_PASSWORD }}
          BRANDHUB_AWS_REGION: ${{ secrets.BRANDHUB_AWS_REGION }}
          BRANDHUB_SQS_QUEUE_URL: ${{ secrets.BRANDHUB_SQS_QUEUE_URL }}
          WORDPRESS_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set the EC2_HOST production secret}"
          : "${EC2_USER:?Set the EC2_USER production secret}"
          for key in MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD \
            WORDPRESS_DB_NAME WORDPRESS_DB_USER WORDPRESS_DB_PASSWORD \
            BRANDHUB_AWS_REGION BRANDHUB_SQS_QUEUE_URL; do
            if [[ -z "${!key}" ]]; then
              echo "Missing production secret: $key" >&2
              exit 1
            fi
          done
          [[ "$MYSQL_DATABASE" == "$WORDPRESS_DB_NAME" ]]
          [[ "$MYSQL_USER" == "$WORDPRESS_DB_USER" ]]
          [[ "$MYSQL_PASSWORD" == "$WORDPRESS_DB_PASSWORD" ]]
          umask 077
          python3 - <<'PY'
          import os
          import sys

          keys = (
              "MYSQL_DATABASE",
              "MYSQL_USER",
              "MYSQL_PASSWORD",
              "MYSQL_ROOT_PASSWORD",
              "WORDPRESS_DB_NAME",
              "WORDPRESS_DB_USER",
              "WORDPRESS_DB_PASSWORD",
              "BRANDHUB_AWS_REGION",
              "BRANDHUB_SQS_QUEUE_URL",
              "WORDPRESS_IMAGE",
          )
          with open(".env", "w", encoding="utf-8", newline="\n") as env_file:
              for key in keys:
                  value = os.environ[key]
                  if "\n" in value or "\r" in value:
                      sys.exit(f"{key} must not contain a newline")
                  value = value.replace("\\", "\\\\").replace("'", "\\'")
                  env_file.write(f"{key}='{value}'\n")
          os.chmod(".env", 0o600)
          PY

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          remote="${EC2_USER}@${EC2_HOST}"
          ssh "$remote" 'mkdir -p "$HOME/wordpress-deploy"'
          scp docker-compose.prod.yml "$remote:wordpress-deploy/"
          scp .env "$remote:wordpress-deploy/.env"
          ssh "$remote" \
            'chmod 600 "$HOME/wordpress-deploy/.env" &&
             cd "$HOME/wordpress-deploy" &&
             docker compose -f docker-compose.prod.yml pull wordpress &&
             docker compose -f docker-compose.prod.yml up -d --remove-orphans'
